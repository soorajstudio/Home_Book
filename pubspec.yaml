name: home_book
description: Home Book - Family Expense & Finance Tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  device_info_plus: ^10.1.0
  fl_chart: ^0.69.0
  pdf: ^3.10.8
  printing: ^5.13.1
  intl: ^0.19.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/App_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/App_icon.png"
  windows:
    generate: true
    image_path: "assets/App_icon.png"
  macos:
    generate: true
    image_path: "assets/App_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/App_icon.png

